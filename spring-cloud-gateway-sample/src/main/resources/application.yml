nacos:
  address: 192.168.33.20:8848
  namespace: prod


server:
  address: 0.0.0.0
  port: 8899
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: my-gateway
  main:
    allow-circular-references: true
    banner-mode: off
  web:
    resources:
      add-mappings: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jmx:
    enabled: false
  config:
    import: optional:nacos:${spring.application.name}
  cloud:
# 这个注释掉就没有 动态路由了, {@link org.springframework.cloud.gateway.discovery.GatewayDiscoveryClientAutoConfiguration.ReactiveDiscoveryClientRouteDefinitionLocatorConfiguration}
#    discovery:
#      reactive:
#        enabled: true
    nacos:
#      username: ${nacos.username}
#      password: ${nacos.password}
      discovery:
#        watch-delay: 5000
        watch:
          enabled: true  # 启用服务监听
        serverAddr: ${nacos.address}
        namespace: ${nacos.namespace}
        group: http  # 只发现这个group下面的
        # 心跳间隔：5s
        heartBeatInterval: 5000
        # 15s 不上报 -> unhealthy
        heartBeatTimeout: 15000
        # 30s 不上报 -> 剔除实例
        ipDeleteTimeout: 30000
        cluster-name: DEFAULT
        fail-fast: true # 强依赖nacos失败就不启动
        ephemeral: true
      config:
        serverAddr: ${nacos.address}
        namespace: ${nacos.namespace}
        file-extension: yaml
        refresh-enabled: true
    loadbalancer:
      nacos:
        enabled: true  # 生产要看下有没有这个, 如果有这个就代表跨集群了  A cross-cluster call occurs
      configurations: health-check  # 启用健康检查 ServiceInstanceListSupplier
      health-check:
        interval: 10s
#        initialDelay: 5s  # todo 这个有点坑 , 健康检查的初始延迟时间，即负载均衡器启动后等待多久才开始执行第一次健康检查，用于给后端服务足够的启动时间
        refetchInstances: true  # 关键：定期从注册中心重新获取实例
        refetchInstancesInterval: 5s  # 重新获取间隔
        repeatHealthCheck: true  # 是否循环健康检查
        updateResultsList: true # 是否根据检查结果实时更新负载均衡器的缓存列表
        path:
#          default: /actuator/health/readiness
          user-demo: /api/user-demo/actuator/health/readiness  # 后续这个需要动态生成
      cache:
        # 如果项目里引入了 Caffeine，Spring Cloud LoadBalancer 会优先使用 Caffeine 缓存实现。官方文档说明，设置 spring.cloud.loadbalancer.cache.caffeine.spec 后，会覆盖普通的 ttl 和 capacity 配置
        enabled: false  # nacos 那边 Spring Cloud Alibaba 的 NacosLoadBalancerClientConfiguration 源码里明确写了：ServiceInstanceListSupplier don't use cache，原因是 LoadBalancerCache 会导致 Nacos 实例权重等信息不能立即生效，而 Nacos 自己已经支持缓存
        ttl: 3s
        capacity: 2048  # 默认是256 超过了就进行驱逐
      retry:
        enabled: true
        retryOnAllOperations: false # 是否对所有 HTTP 方法都允许重试。默认 false，核心含义是：默认只重试 GET 这类幂等请求
        #  是否所有异常都重试。默认 false，表示只重试 retryableExceptions 里面配置的异常。官方配置项也说明了该属性默认不开启
        # 默认可重试异常大致是：
        # IOException.class
        #TimeoutException.class
        #RetryableStatusCodeException.class
        #org.springframework.cloud.client.loadbalancer.reactive.RetryableStatusCodeException.class
        retryOnAllExceptions: false
        max-retries-on-next-service-instance: 1 # 最多换几个新实例重试。默认是 1，表示：第一次请求实例 A 失败后，可以再选择一个实例 B 重试一次。官方默认值也是 1。
        maxRetriesOnSameServiceInstance: 0 # 在同一个服务实例上最多重试几次。默认是 0，表示：某个实例失败后，不在这个实例上再试
        # 哪些 HTTP 状态码可以触发重试。默认是空集合，表示默认不因为 HTTP 状态码自动重试
        retryable-status-codes:
          - 502 # Bad Gateway
          - 503 # Service Unavailable
          - 504 # Gateway Timeout
        backoff:
          enabled: true
          min-backoff: 50ms  # 第一次重试前至少等多久
          max-backoff: 500ms  # 退避最大不超过多久
          jitter: 0.5  # 抖动比例，避免所有请求同一时间重试
    gateway.server.webflux:
      enabled: true
      # 默认下面2个是true, 但是这个在高并发下比较影响性能
      # 是在 org.springframework.cloud.gateway.config.GatewayMetricsAutoConfiguration 这个类下面的
      metrics:
        enabled: true
      observability:
        enabled: true
      #      discovery:
#        locator:
#          # 启用服务发现, 并把服务名转小写
#          enabled: true
#          lowerCaseServiceId: true # 忽略服务名的大小写
      httpclient:
        # 这个不要开, 默认 compression 就是false
        # 网关的 HttpClient 会主动向后端声明 Accept-Encoding 并自动解压后端的响应。后果是：
        #- 同一份数据经历：后端压缩 → 网关解压 → 网关再压缩，三次 CPU 运算，两次是纯浪费，全落在网关上，开这个等于把 CPU 上去；
        #- SCG 历史上在这条路径上有多个 header 处理 bug（解压了 body 但 Content-Encoding/Content-Length 没清理干净），客户端会报 ERR_CONTENT_DECODING_FAILED 或拿到声明 gzip 实际是明文的响应。
        # 结论：这个配置永远别开，保持现状。
        compression: false
        connect-timeout: 3000          # 连接超时，毫秒
        response-timeout: 10s          # 响应超时,  发出请求到收到响应的整体超时
        pool:
          type: fixed                  # 固定连接池（生产推荐）, DISABLED 每次请求新建,  FIXED 有上限, ELASTIC 无上限是int最大值
          # LIFO 后进先出, 用热连接  好处:让闲置连接更快撞到 max-idle-time 被回收,池子能自然缩容;复用的连接 TCP 拥塞窗口大、TLS session 活跃,延迟更低。适合波动流量
          # FIFO(默认): 先进先出,连接轮流用,负载均匀、所有连接都被保活不容易缩容。适合稳定的持续高流量。
          leasing-strategy: FIFO
          max-connections: 200         # 最大连接数, 每个ip:port 200, 只使用与fixed类型
          acquire-timeout: 3000        # 获取连接超时, 从池里"借"连接的排队超时(池满时排队等多久)
          max-idle-time: 90s           # 最大空闲时间, 连接空闲超过 90s,下次取用前会被关闭重建。默认 null(永不因空闲关闭)
          max-life-time: 1800s         # 连接最大存活时间, 会强制杀掉所有连接，包括 WebSocket 连接, 连接从创建起,无论忙闲,存活满多少 就被回收。默认 null(永不)
          eviction-interval: 30s       # 定期清理空闲连接, 后台起一个定时任务,每 20s 主动扫描并关闭过期(超 idle/life)的连接。默认 Duration.ZERO(关闭), :一般取 max-idle-time 的 1/2 ~ 1/3,保证过期连接最多多活一个间隔
          # 把连接池指标注册到 Micrometer。默认 false
          # 开启后能拿到 reactor.netty.connection.provider.total.connections / active.connections / pending.connections / idle.connections 等指标。
          # pending.connections 持续 > 0 就是连接池不够用的铁证,是调 max-connections 的直接依据。
          metrics: true
      routeFilterCacheEnabled: false # 路由过滤器缓存, 这个如果要缓存要注意一下共享变量, 所有请求相关的数据都存储在 ServerWebExchange 的 attributes 中
      global-filter: # 全局过滤器, 内置默认的
        reactive-load-balancer-client:
          enabled: true  # 不想用可以关掉
#      default-filters: # 默认过滤器, 可以有多个
#        - StripPrefix=1  # 去掉url里面的第一段进行转发
#        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
#        - RemoveRequestHeader=Cookie  # 根据需要移除敏感头
      routes:
        # http://127.0.0.1:8899/api/user-demo/test
        - id: user_route
          uri: lb://user-demo
          predicates:
            # 有很多内置的 predicate , https://springdoc.cn/spring-cloud-gateway/#gateway-request-predicates-factories
            - Path=/api/user-demo/**
            - Test1Predicate=GET
#            - PrefixPath=/api/user-demo  # url前面加一些固定的前缀
          filters:
            # StripPrefixGatewayFilterFactory
#            - StripPrefix=1  # 去掉url里面的第一段进行转发
            - name: Test1
              args:
                prefix: abc
            # PrefixPathGatewayFilterFactory允许你在对应的路由请求前增加前缀。例如实例配置中的请求/user，最后转发到目标服务的路径变为/user/hello
#            - PrefixPath=/mypath
# ======================== websocket ==================================================
        # to run server $ wscat --listen 9000
        # to run client  $ wscat --connect ws://localhost:8080/echo
#        - id: websocket_test
#          uri: ws://localhost:9000
#          order: 9000
#          predicates:
#            - Path=/echo
# =================== 权重 ======================================================
#        - id: user-service-prod
#          uri: http://www.iocoder.cn
#          predicates:
#            - Path=/**
#            - Weight=user-service, 90   # 第一个参数为权重分组，需要配置成相同，一般和服务名相同即可；第二个参数为权重比例
#        - id: user-service-canary
#          uri: https://www.oschina.net
#          predicates:
#            - Path=/**
#            - Weight=user-service, 10




