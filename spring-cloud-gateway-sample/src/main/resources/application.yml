nacos:
  address: 192.168.33.20:8848
  namespace: prod


server:
  address: 0.0.0.0
  port: 8899
  shutdown: graceful

spring:
  application:
    name: my-gateway
  main:
    allow-circular-references: true
    banner-mode: off
  web:
    resources:
      add-mappings: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  jmx:
    enabled: false
  cloud:
    nacos:
      #      username: ${nacos.username}
      #      password: ${nacos.password}
      discovery:
        server-addr: ${nacos.address}
        namespace: ${nacos.namespace}
    gateway.server.webflux:
      routes:
        # =====================================
        # to run server
        # $ wscat --listen 9000
        # to run client
        # $ wscat --connect ws://localhost:8080/echo
        - id: websocket_test
          uri: ws://localhost:9000
          order: 9000
          predicates:
            - Path=/echo
        # =====================================
        # http://127.0.0.1:8899/user/test
        - id: user_route
          uri: lb://user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1
        # =====================================
        # http://127.0.0.1:8899/testSearch
        - id: hot_list
          uri: https://www.pxb7.com
          order: 10000
          predicates:
            - Path=/testSearch
          filters:
            - SetPath=/api/search/game/selectHotList
            - AddRequestParameter=pageIndex, 1
            - AddRequestParameter=pageSize, 8
            - AddRequestParameter=bizProd, 1
            - AddRequestParameter=posType, 3

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.ipc.netty: DEBUG
    reactor.netty: DEBUG

management.endpoints.web.exposure.include: '*'
