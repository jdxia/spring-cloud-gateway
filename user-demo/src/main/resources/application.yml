nacos:
  address: 192.168.33.20:8848
  namespace: prod

server:
  address: 0.0.0.0
  port: 8890
  shutdown: graceful

spring:
  main:
    allow-circular-references: true
    banner-mode: off
  web:
    resources:
      add-mappings: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  application:
    name: user
  cloud:
    nacos:
#      username: ${nacos.username}
#      password: ${nacos.password}
      discovery:
        server-addr: ${nacos.address}
        namespace: ${nacos.namespace}
